<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulários com Output</h1>
    <hr>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Formulário de Soma</legend>
            <p>
                <label for="in1">Insira o primeiro número: </label>
                <input type="number" name="n1" id="in1" min="0" max="30" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            </p>
            <p>
                <label for="in2">Insira o segundo número: </label>
                <input type="number" name="n2" id="in2" min="0" max="30" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            </p>
            <p>
                <label for="isoma">Soma Total: </label>
                <output name="soma" id="isoma"></output>
            </p>
            <p>
                <input type="submit" value="ENVIAR" id="enviar">
                <input type="reset" value="LIMPAR" id="enviar">
            </p>
        </fieldset>

        <fieldset>
            <legend>Formulário de Range</legend>
            <p>
                <label for="inum">Número: </label>
                <input type="range" name="num" id="inum" min="1" max="50" value="25" oninput="ival.innerHTML = Number(inum.value)">
                <output id="ival">25</output>
            </p>
            <p>
                <input type="submit" value="ENVIAR" id="enviar">
                <input type="reset" value="LIMPAR" id="enviar">
            </p>
        </fieldset>

        <fieldset>
            <legend>Formulário de Calculo de Idade</legend>
            <p>
                <label for="iano">Digite o ano em que você nasceu: </label>
                <input type="number" name="ano" id="iano" min="1900" max="2100" oninput="calcIdade()">
            </p>
            <p>
                <label for="iidade">Sua idade neste ano será de: </label>
                <output id="iidade">0</output>
            </p>
            <p>
                <input type="submit" value="ENVIAR" id="enviar">
                <input type="reset" value="LIMPAR" id="enviar">
            </p>
        </fieldset>
    </form>  
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>  
</body>
</html>
