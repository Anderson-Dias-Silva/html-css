<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        * {
            font-family: monospace;
        }   

        h1 {
            text-align: center;
            background-color: rgb(252, 252, 193);
            box-shadow: 2px 2px 2px black;
            border: 0.3px solid black;
            border-radius: 5px;
        }

        div.conteiner {
            background-color: blueviolet;

            display: flex;
            flex-flow: row nowrap;
            align-items: flex-start;
            height: 200px;
        }

        div.item {
            background-color: yellow;
            border: 1px solid black;
            text-align: center;
            
        
            padding: 10px;
            font-size: 1.7em;
        }

        div#i1{
            order: 1;
            align-self: flex-end;
        }

        div#i2{
            order: 2;
            align-self: center;
        }

        div#i3{
            order: -1;
            align-self: flex-end;
            flex-basis: 100px;
            flex-grow: 2;
            flex-shrink: 0;
        }

        div#i4{
            order: 0;
            align-self: center;
        }

        div#i5{
            order: 3;
            align-self: stretch;
        }

        div#i6{
            order: -3;
            align-self: stretch;
            flex-basis: 100px;
            flex-grow: 1;
            flex-shrink: 1;
        }

        div#i7{
            order: 4;
            align-self: auto;
        }

        div#i8{
            order: -4;
            align-self: auto;
            flex-basis: 100px;
            flex-grow: 0;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <h1>TESTANDO O FLEXIBLE BOX</h1>

    <div class="conteiner">
        <div class="item" id="i1">01</div>
        <div class="item" id="i2">02</div>
        <div class="item" id="i3">03</div>
        <div class="item" id="i4">04</div>
        <div class="item" id="i5">05</div>
        <div class="item" id="i6">06</div>
        <div class="item" id="i7">07</div>
        <div class="item" id="i8">08</div>
    </div>
</body>
</html>
